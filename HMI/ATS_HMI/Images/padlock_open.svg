<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Open padlock illustration</title>
  <desc>An open padlock with the shackle flipped to the left, left leg anchored, arc and right leg extending leftward</desc>

  <style>
    .lock-body { fill: #4A90D9; }
    .lock-shadow { fill: #2E6FAF; }
    .shackle { fill: none; stroke: #2E5FA3; stroke-width: 28; stroke-linecap: round; }
    .shackle-highlight { fill: none; stroke: #6EB3F5; stroke-width: 8; stroke-linecap: round; }
    .keyhole-bg { fill: #1A3D6E; }
    .keyhole-shine { fill: rgba(255,255,255,0.18); }
    .rivet { fill: #2E6FAF; }
    .shine { fill: rgba(255,255,255,0.15); }
  </style>

  <path class="shackle" d="M270 290 L270 180 Q270 100 200 100 Q130 100 130 180 L130 240" />
  <path class="shackle-highlight" d="M270 290 L270 182 Q270 108 200 108 Q138 108 138 182 L138 238" />

  <rect class="lock-shadow" x="218" y="288" width="248" height="192" rx="20"/>
  <rect class="lock-body" x="212" y="280" width="248" height="192" rx="20"/>
  <rect class="shine" x="212" y="280" width="248" height="60" rx="20"/>

  <circle class="rivet" cx="244" cy="318" r="10"/>
  <circle class="rivet" cx="436" cy="318" r="10"/>
  <circle class="rivet" cx="244" cy="440" r="10"/>
  <circle class="rivet" cx="436" cy="440" r="10"/>

  <circle class="keyhole-bg" cx="336" cy="368" r="36"/>
  <circle class="keyhole-shine" cx="326" cy="358" r="10"/>
  <rect class="keyhole-bg" x="320" y="392" width="32" height="44" rx="10"/>
</svg>
